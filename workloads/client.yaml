apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: netpath-lab
  labels:
    app: client
    app.kubernetes.io/part-of: netpath-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
        app.kubernetes.io/part-of: netpath-lab
    spec:
      containers:
        - name: client
          image: curlimages/curl:8.12.1
          command:
            - sh
            - -c
            - sleep 36000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
